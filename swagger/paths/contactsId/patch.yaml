patch:
  tags:
    - Contacts
  summary: Оновити контакт за Id
  operationId: updateContactById
  description: Оновлює дані певного контакта за його ID
  security:
    - bearerAuth: []
  parameters:
    - name: contactId
      in: path
      required: true
      description: Унікальний ідентифікатор контакту
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/UpdateContact'
  responses:
    '200':
      description: Контакт оновлено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Contact'
    '404':
      description: Контакт не знайдено
