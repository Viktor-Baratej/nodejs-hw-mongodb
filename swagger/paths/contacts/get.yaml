tags:
  - Contacts
summary: Отримати всі контакти користувача
operationId: getAllContacts
description: |
  Отримати список всіх контактів, з optional query параметрами фільтрації, пагінації та сортування.
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    required: false
    schema:
      type: integer
      example: 1
    description: 'Номер сторінки для пагінації. За замовчуванням 1.'
  - name: perPage
    in: query
    required: false
    schema:
      type: integer
      example: 10
    description: 'Кількість елементів на сторінці. За замовчуванням 10.'
  - name: sortBy
    in: query
    required: false
    schema:
      type: string
      example: 'name'
    description: 'Параметр для сортування за полем. За замовчуванням - name.'
  - name: sortOrder
    in: query
    required: false
    schema:
      type: string
      enum: ['asc', 'desc']
      example: 'asc'
    description: 'Параметр для сортування у порядку зростання або спадання.'
  - name: filter
    in: query
    required: false
    schema:
      type: string
      example: 'favorite=true'
    description: 'Фільтрація за певним параметром. Наприклад, favorite=true для фільтрації за улюбленими контактами.'
  - name: type
    in: query
    required: false
    schema:
      type: string
      example: 'work'
    description: 'Фільтрація за типом контакту. Можливі значення: work, home, personal.'
  - name: isFavourite
    in: query
    required: false
    schema:
      type: boolean
      example: true
    description: 'Фільтрація за ознакою улюбленості контакту.'
responses:
  '200':
    description: Успішно отримано список контактів
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully fetched contacts'
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/Contact.yaml'
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 100
                totalPages:
                  type: integer
                  example: 10
                hasNextPage:
                  type: boolean
                  example: true
                hasPreviousPage:
                  type: boolean
                  example: false
  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
