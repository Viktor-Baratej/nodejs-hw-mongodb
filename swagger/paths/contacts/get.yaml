get:
  tags:
    - Contacts
  summary: Отримати всі контакти користувача
  operationId: getAllContacts
  description: Отримати список всіх контактів, з optional query параметрами фільтрації
  security:
    - bearerAuth: []
  parameters:
    - name: page
      in: query
      required: false
      schema:
        type: integer
        example: 1
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        example: 20
    - name: favorite
      in: query
      required: false
      schema:
        type: boolean
        example: true
  responses:
    '200':
      description: Успішно отримано список контактів
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../components/schemas/Contact.yaml'
