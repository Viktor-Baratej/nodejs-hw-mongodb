tags:
  - Contacts
summary: Оновити контакт за Id
operationId: updateContact
description: Оновлює контакт за його унікальним ідентифікатором
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    description: Унікальний ідентифікатор контакту
    schema:
      type: string
      example: '60d6b3e32f9b8c001c2bb8d7'
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Ім'я контакту"
            type: string
            example: 'Artem Baratej'
          phoneNumber:
            description: "Номер телефону контакту"
            type: string
            example: '+38011111111'
          email:
            description: "Електронна пошта контакту"
            type: string
            example: 'Tema1814@gmail.com'
          isFavourite:
            description: 'Чи є цей контакт улюбленим'
            type: boolean
            example: true
          contactType:
            description: 'Тип контакту (work, home, personal)'
            type: string
            enum:
              - 'work'
              - 'home'
              - 'personal'
            example: 'personal'
          photo:
            description: "Аватар контакту"
            type: string
            format: binary
responses:
  '200':
    description: Контакт успішно оновлено
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Контакт успішно оновлено'
            data:
              type: object
              $ref: '../../../components/schemas/Contact.yaml'
  '400':
    $ref: '../../../components/responses/400.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'








