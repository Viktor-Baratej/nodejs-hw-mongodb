tags:
  - Contacts
summary: Оновити контакт за Id
operationId: updateContact
description: Оновлює контакт за його унікальним ідентифікатором. Підтримується оновлення лише тих полів, які передано в тілі запиту. Якщо фото нового контакту надається, воно буде оновлено.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    description: Унікальний ідентифікатор контакту, який потрібно оновити
    schema:
      type: string
      example: '60d6b3e32f9b8c001c2bb8d7'
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: 'Updated Name'
            description: 'Нове імя контакту'
          email:
            type: string
            example: 'updated@example.com'
            description: 'Оновлена електронна пошта контакту'
          phone:
            type: string
            example: '+380991234567'
            description: 'Оновлений номер телефону контакту'
          favorite:
            type: boolean
            example: true
            description: 'Позначка, чи є контакт у списку улюблених'
          photo:
            type: string
            format: binary
            description: 'Фото контакту для оновлення (бінарний формат)'
        required:
          - name
          - phone
responses:
  '200':
    description: Контакт успішно оновлено
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/Contact.yaml'
  '400':
    $ref: '../../../components/responses/400.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'
