tags:
  - Contacts
summary: Оновити контакт за ID
operationId: updateContactById
description: Оновлює дані контакту за його ID
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    description: Унікальний ідентифікатор контакту
    schema:
      type: string
      example: '12345'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../../components/schemas/UpdateContact.yaml'
responses:
  '200':
    description: Контакт оновлено
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/Contact.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
