tags:
  - Contacts
summary: Отримати контакт за ID
operationId: getContactById
description: Отримує інформацію про контакт за його унікальним ID
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    description: Унікальний ідентифікатор контакту
    schema:
      type: string
      example: '12345'
responses:
  '200':
    description: Контакт знайдено
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contact with id 12345!
            data:
              type: object
              $ref: '../../../components/schemas/Contact.yaml'
  '404':
    description: Контакт не знайдено
    content:
      application/json:
        schema:
          $ref: '../../../components/responses/404.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
