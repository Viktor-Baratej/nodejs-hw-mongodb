type: object
required:
  - name
  - email
  - phoneNumber
properties:
  name:
    type: string
    example: 'Artem Baratej'
  email:
    type: string
    example: 'artemb@example.com'
  phoneNumber:
    type: string
    example: '+380991234567'
  isFavourite:
    type: boolean
    example: false
  contactType:
    type: string
    enum:
      - 'work'
      - 'home'
      - 'personal'
    example: 'personal'
  photo:
    type: string
    example: 'https://example.com/photo.jpg'
